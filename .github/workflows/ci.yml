name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Nothing is installed here, on purpose.
    #
    # The suite is stdlib-only so that it runs from a bare checkout, and that is not a
    # convenience -- it is what lets the Windows-specific logic in fsperm, localkey and the
    # writers be exercised *natively* rather than simulated from Linux. Three of the five traps
    # in CLAUDE.md are things no amount of testing on the development platform could surface.
    #
    # So this job is itself the assertion. If a test ever starts importing cli, crypto or
    # source, it will fail here with ModuleNotFoundError rather than quietly acquiring a
    # `pip install` step, and the property will not erode unnoticed.
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the other platforms. A failure that reproduces on exactly one of them is
      # the interesting kind, and fail-fast hides precisely that.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite with no dependencies installed
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  entry-point:
    # The suite deliberately never imports cli, crypto or source, so nothing above would notice
    # a syntax error, a bad import or a broken argparse setup in any of them. This job installs
    # for real -- PyNaCl and ccl_chromium_reader included -- and drives the entry point, which
    # imports every module in the project.
    name: entry point (installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Import every module and render --help
        run: python -m termius_export --help

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff turns "someone released a new rule" into "the build is red on
      # an unrelated PR". Bump it deliberately.
      - run: pip install ruff==0.16.2
      - run: ruff check .
