[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termius-export"
version = "0.1.0"
description = "Decrypt Termius's local data offline and convert your hosts, SSH keys, port forwards and proxies into OpenSSH, Tabby, Termix, CSV or JSON. Termius never needs to run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["termius", "ssh", "migration", "indexeddb", "export"]

dependencies = [
  "PyNaCl>=1.5",
  # Chromium IndexedDB / V8 structured-clone parsing. GitHub-only, not on PyPI.
  "ccl_chromium_reader @ git+https://github.com/cclgroupltd/ccl_chromium_reader",
]

[project.scripts]
termius-export = "termius_export.cli:main"

[project.urls]
Homepage = "https://github.com/y01and3/termius-export"
Issues = "https://github.com/y01and3/termius-export/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.format]
# ruff formats Python fenced in Markdown too. The snippets in CLAUDE.md and README.md are
# illustrations, not code -- some are deliberately aligned to make a point, and one is not even
# valid on its own -- so the formatter has no business rewriting them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# E402: every test does `sys.path.insert(0, "src")` before importing the package, so its
#   imports cannot be at the top of the file. The suite runs straight from a checkout with
#   nothing installed, which is the property that makes it work on a bare Windows box.
# UP012: `"...".encode("utf-8")` is redundant to Python and load-bearing to the reader here.
#   These tests assert *which* encoding was produced -- test_localkey disambiguates UTF-8 from
#   UTF-16 credential blobs, test_newlines checks the file was written as UTF-8 -- so dropping
#   the argument would make the assertion say less than it means.
"tests/*" = ["E402", "UP012"]
